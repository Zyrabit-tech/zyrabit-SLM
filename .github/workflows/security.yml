name: Zyrabit Sovereign Security Audit

on:
  push:
    branches: [ main, beta ]
  pull_request:
    branches: [ main, beta ]
  schedule:
    - cron: '0 0 * * 1' # Weekly audit on Monday
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-dependency-audit:
    name: Dependency Audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Setup Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Run pip-audit and require a visible risk record
        run: |
          set +e
          uv run pip-audit --format json --output pip-audit.json
          audit_exit=$?
          set -e
          python validation/scripts/verify_dependency_risks.py pip-audit.json docs/security/DEPENDENCY_RISKS.md
          exit "$audit_exit"

  trivy-scan:
    name: Trivy Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy FS scan (Library Audit)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

  codeql-analysis:
    name: CodeQL Semantic Audit
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python, javascript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
