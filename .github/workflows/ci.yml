name: CI

on:
  pull_request:
    branches:
      - main
      - beta
      - 'beta-*'
  push:
    branches:
      - main
      - beta
      - 'beta-*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  contribution-policy:
    name: Contribution Policy
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR base branch policy
        if: github.event_name == 'pull_request'
        run: |
          BASE="${{ github.base_ref }}"
          HEAD="${{ github.head_ref }}"
          echo "PR: ${HEAD} → ${BASE}"

          # main: only beta can merge into it
          if [ "${BASE}" = "main" ]; then
            if [ "${HEAD}" != "beta" ]; then
              echo "❌ Only 'beta' can merge into 'main'. Got: '${HEAD}'"
              exit 1
            fi
            echo "✅ Release promotion beta → main: OK"
            exit 0
          fi

          # beta-x.y.z branches: only feat/* or fix/* branches can target them
          if echo "${BASE}" | grep -qE '^beta-[0-9]+\.[0-9]+\.[0-9]+$'; then
            if ! echo "${HEAD}" | grep -qE '^(feat|fix|chore|docs)/'; then
              echo "❌ Only feat/*, fix/*, chore/*, docs/* branches can target '${BASE}'. Got: '${HEAD}'"
              exit 1
            fi
            echo "✅ Feature branch targeting beta version branch: OK"
            exit 0
          fi

          # beta: feat/* can target it, or any branch following gitflow
          if [ "${BASE}" = "beta" ]; then
            echo "✅ Targeting staging (beta) branch: OK"
            exit 0
          fi

          echo "❌ Pull requests must target 'beta', 'beta-x.y.z', or 'main'. Got base: '${BASE}'"
          exit 1

      - name: Policy check summary
        run: echo "✅ Contribution policy check passed."

  tests:
    name: Python Tests
    runs-on: ubuntu-latest
    needs: contribution-policy
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_PYTHON_VERSION_WARNING: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-path: |
            requirements.txt
            zyrabit-slm/api-rag/requirements.txt

      - name: Setup Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Validate Python imports/compilation
        run: |
          uv run python -m compileall secure_agent.py zyrabit-slm/api-rag/app

      - name: Run API tests
        run: uv run pytest

  frontend-tests:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest
    needs: contribution-policy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node & pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: zyrabit-slm/web-ui/pnpm-lock.yaml

      - name: Install Frontend Dependencies
        run: |
          cd zyrabit-slm/web-ui
          pnpm install --frozen-lockfile

      - name: Frontend Build Verification
        run: |
          cd zyrabit-slm/web-ui
          pnpm build

  docs-build-verification:
    name: Docs Portal Build Verification
    runs-on: ubuntu-latest
    needs: contribution-policy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node & pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: docs-portal/pnpm-lock.yaml

      - name: Install Docs Dependencies
        run: |
          cd docs-portal
          pnpm install --frozen-lockfile

      - name: Docs Portal Build Verification
        run: |
          cd docs-portal
          pnpm build

  docker-build-verification:
    name: Docker Build Verification (No-Push)
    runs-on: ubuntu-latest
    needs: [tests, frontend-tests, docs-build-verification]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API-RAG Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./zyrabit-slm/api-rag/Dockerfile
          push: false
          platforms: linux/amd64
          cache-from: type=gha

      - name: Build Web-UI Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./zyrabit-slm/web-ui/Dockerfile
          push: false
          platforms: linux/amd64
          cache-from: type=gha

  production-build-gate:
    name: Production Build Gate
    runs-on: ubuntu-latest
    needs: [tests, frontend-tests, docs-build-verification, docker-build-verification]
    # Run gate when PR targets main, beta, or any beta-x.y.z branch
    if: >
      github.event_name == 'pull_request' && (
        github.base_ref == 'main' ||
        github.base_ref == 'beta' ||
        startsWith(github.base_ref, 'beta-')
      )
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Production Compose Configuration
        run: |
          cd zyrabit-slm
          touch .env
          PROMETHEUS_BASIC_AUTH="dummy:dummy" GRAFANA_BASIC_AUTH="dummy:dummy" OLLAMA_NUM_PARALLEL=1 docker compose config -q
          echo "✅ Production docker-compose.yml is valid."

      - name: Integrity Check (Structure)
        run: |
          if [ ! -f zyrabit-slm/api-rag/app/HEXAGONAL_ARCHITECTURE.md ]; then
            echo "❌ ERROR: HEXAGONAL_ARCHITECTURE.md is missing!"
            exit 1
          fi
          echo "✅ Architectural documentation present."

  auto-tag-beta:
    name: Auto-Tag Beta Release
    runs-on: ubuntu-latest
    needs: [tests, frontend-tests, docs-build-verification, docker-build-verification]
    if: github.event_name == 'push' && github.ref_name == 'beta'
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read VERSION and evaluate tag
        id: tag_check
        run: |
          VERSION=$(cat VERSION | tr -d '\n' | xargs)
          TAG="v${VERSION}"
          echo "Target tag: ${TAG}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

          if git rev-parse "${TAG}" >/dev/null 2>&1; then
            echo "ℹ️ Tag ${TAG} already exists. Skipping auto-tag."
            echo "should_tag=false" >> $GITHUB_OUTPUT
          else
            echo "🚀 New version detected! Tag ${TAG} does not exist yet."
            echo "should_tag=true" >> $GITHUB_OUTPUT
          fi

      - name: Create and push tag
        if: steps.tag_check.outputs.should_tag == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag_check.outputs.tag }}"
          echo "Creating and pushing tag ${TAG}..."
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "Release ${TAG} (automated from beta CI)"
          git push origin "${TAG}"
          echo "✅ Tag ${TAG} pushed successfully. This triggers the Release and Deploy pipeline."

