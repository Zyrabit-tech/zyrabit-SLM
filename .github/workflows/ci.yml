name: CI

on:
  pull_request:
    branches:
      - main
      - beta-**
  push:
    branches:
      - beta-**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  contribution-policy:
    name: Contribution Policy
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR base branch policy
        if: github.event_name == 'pull_request'
        run: |
          HEAD="${{ github.head_ref }}"
          BASE="${{ github.base_ref }}"
          echo "PR: ${HEAD} → ${BASE}"

          # Rule 1: PRs to main must come ONLY from a beta-X.Y.Z branch
          if [ "${BASE}" = "main" ]; then
            if ! echo "${HEAD}" | grep -qE '^beta-[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo ""
              echo "❌ ERROR: Los PRs a 'main' solo se aceptan desde una rama 'beta-X.Y.Z'."
              echo "   Rama detectada: '${HEAD}'"
              echo ""
              echo "   ¿Cómo resolverlo?"
              echo "   1. Identifica la versión activa: ej. beta-2.3.0"
              echo "   2. Haz PR de tu rama → beta-2.3.0 primero."
              echo "   3. Luego, desde beta-2.3.0, abre el PR → main."
              echo ""
              exit 1
            fi
            echo "✅ PR desde rama beta versionada: ${HEAD}"
          fi

          # Rule 2: PRs to beta-X.Y.Z are allowed from any feature branch
          if echo "${BASE}" | grep -qE '^beta-[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "✅ PR a rama beta versionada: ${BASE}"
          fi

          # Rule 3: Block PRs to unversioned 'beta' — legacy branch
          if [ "${BASE}" = "beta" ]; then
            echo ""
            echo "❌ ERROR: La rama 'beta' ya no acepta PRs directos."
            echo "   Usa una rama versionada como 'beta-2.3.0' como destino."
            echo ""
            exit 1
          fi
      - name: Policy check summary
        run: echo "Contribution policy check passed."

  tests:
    name: Python Tests
    runs-on: ubuntu-latest
    needs: contribution-policy
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_PYTHON_VERSION_WARNING: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-path: |
            requirements.txt
            zyrabit-slm/api-rag/requirements.txt

      - name: Setup Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Validate Python imports/compilation
        run: |
          uv run python -m compileall secure_agent.py zyrabit-slm/api-rag/app

      - name: Run API tests
        run: uv run pytest

  production-build-gate:
    name: Production Build Gate
    runs-on: ubuntu-latest
    needs: tests
    if: github.base_ref == 'main' || github.base_ref == 'beta'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Production Compose Configuration
        run: |
          cd zyrabit-slm
          touch .env
          PROMETHEUS_BASIC_AUTH="dummy:dummy" GRAFANA_BASIC_AUTH="dummy:dummy" OLLAMA_NUM_PARALLEL=1 docker compose config -q
          echo "✅ Production docker-compose.yml is valid."

      - name: Integrity Check (Structure)
        run: |
          if [ ! -f zyrabit-slm/api-rag/app/HEXAGONAL_ARCHITECTURE.md ]; then
            echo "❌ ERROR: HEXAGONAL_ARCHITECTURE.md is missing!"
            exit 1
          fi
          echo "✅ Architectural documentation present."
