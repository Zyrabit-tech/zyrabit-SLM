name: CI

on:
  pull_request:
    branches:
      - main
      - beta
      - 'beta-*'       # e.g. beta-2.3.0, beta-3.0.0
      - 'feat/**'      # feature branches targeting beta/*
  push:
    branches:
      - beta
      - 'beta-*'       # e.g. beta-2.3.0
      - 'feat/**'      # feature branches (runs tests on every push)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  contribution-policy:
    name: Contribution Policy
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR base branch policy
        if: github.event_name == 'pull_request'
        run: |
          BASE="${{ github.base_ref }}"
          HEAD="${{ github.head_ref }}"
          echo "PR: ${HEAD} → ${BASE}"

          # main: only beta can merge into it
          if [ "${BASE}" = "main" ] && [ "${HEAD}" != "beta" ]; then
            echo "❌ Only 'beta' can merge into 'main'. Got: '${HEAD}'"
            exit 1
          fi

          # beta-x.y.z branches: only feat/* or fix/* branches can target them
          if echo "${BASE}" | grep -qE '^beta-[0-9]+\.[0-9]+\.[0-9]+$'; then
            if ! echo "${HEAD}" | grep -qE '^(feat|fix|chore|docs)/'; then
              echo "❌ Only feat/*, fix/*, chore/*, docs/* branches can target '${BASE}'. Got: '${HEAD}'"
              exit 1
            fi
            echo "✅ Feature branch targeting beta version branch: OK"
            exit 0
          fi

          # beta: feat/* can target it, or any branch following gitflow
          if [ "${BASE}" = "beta" ]; then
            echo "✅ Targeting staging (beta) branch: OK"
            exit 0
          fi

          echo "❌ Pull requests must target 'beta', 'beta-x.y.z', or 'main'. Got base: '${BASE}'"
          exit 1

      - name: Policy check summary
        run: echo "✅ Contribution policy check passed."

  tests:
    name: Python Tests
    runs-on: ubuntu-latest
    needs: contribution-policy
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_PYTHON_VERSION_WARNING: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-path: |
            requirements.txt
            zyrabit-slm/api-rag/requirements.txt

      - name: Setup Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Validate Python imports/compilation
        run: |
          uv run python -m compileall secure_agent.py zyrabit-slm/api-rag/app

      - name: Run API tests
        run: uv run pytest

  production-build-gate:
    name: Production Build Gate
    runs-on: ubuntu-latest
    needs: tests
    # Run gate when PR targets main, beta, or any beta-x.y.z branch
    if: >
      github.event_name == 'pull_request' && (
        github.base_ref == 'main' ||
        github.base_ref == 'beta' ||
        startsWith(github.base_ref, 'beta-')
      )
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Production Compose Configuration
        run: |
          cd zyrabit-slm
          touch .env
          PROMETHEUS_BASIC_AUTH="dummy:dummy" GRAFANA_BASIC_AUTH="dummy:dummy" OLLAMA_NUM_PARALLEL=1 docker compose config -q
          echo "✅ Production docker-compose.yml is valid."

      - name: Integrity Check (Structure)
        run: |
          if [ ! -f zyrabit-slm/api-rag/app/HEXAGONAL_ARCHITECTURE.md ]; then
            echo "❌ ERROR: HEXAGONAL_ARCHITECTURE.md is missing!"
            exit 1
          fi
          echo "✅ Architectural documentation present."
