name: Release and Deploy

on:
  push:
    tags:
      - 'v*'       # e.g. v2.4.3
  workflow_dispatch:
    inputs:
      force_push:
        description: 'Force Docker push regardless of branch'
        required: false
        default: 'false'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  IMAGE_NAME: zyrabit-slm

jobs:
  security-gate:
    name: Security Vulnerability Scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: './zyrabit-slm/api-rag'
          severity: 'CRITICAL'
          exit-code: '1'

  build-arch:
    name: Build Arch Image
    needs: security-gate
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch_suffix: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch_suffix: arm64
    permissions:
      contents: read
      packages: write
      actions: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read VERSION
        id: version
        run: |
          VERSION_VAL=$(cat VERSION | tr -d '\n' | xargs)
          echo "tag=v${VERSION_VAL}"    >> $GITHUB_OUTPUT
          echo "version=${VERSION_VAL}" >> $GITHUB_OUTPUT

      - name: Resolve branch type
        id: meta
        run: |
          BRANCH="${{ github.ref_name }}"
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="zyrabitcore/${{ env.IMAGE_NAME }}"
          GHCR="ghcr.io/${OWNER}/${{ env.IMAGE_NAME }}"

          echo "branch=${BRANCH}" >> $GITHUB_OUTPUT
          echo "owner=${OWNER}"   >> $GITHUB_OUTPUT
          echo "image=${IMAGE}"     >> $GITHUB_OUTPUT
          echo "ghcr=${GHCR}"       >> $GITHUB_OUTPUT

          git fetch origin main
          if git merge-base --is-ancestor HEAD origin/main; then
            ON_MAIN=true
          else
            ON_MAIN=false
          fi
          python3 scripts/resolve_release_channel.py \
            --ref "${BRANCH}" \
            --version "$(cat VERSION | tr -d '\n' | xargs)" \
            --on-main "${ON_MAIN}" \
            --github-output "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        if: steps.meta.outputs.channel == 'stable' || steps.meta.outputs.channel == 'beta'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.meta.outputs.channel == 'stable' || steps.meta.outputs.channel == 'beta'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: steps.meta.outputs.channel == 'stable' || steps.meta.outputs.channel == 'beta'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PAT }}

      - name: Build and push image by digest
        id: build
        if: steps.meta.outputs.channel == 'stable' || steps.meta.outputs.channel == 'beta'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./zyrabit-slm/api-rag/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,"name=${{ steps.meta.outputs.image }},${{ steps.meta.outputs.ghcr }}",push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export digest
        if: steps.meta.outputs.channel == 'stable' || steps.meta.outputs.channel == 'beta'
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          printf '%s\n' "$digest" > "${{ runner.temp }}/digests/${{ matrix.arch_suffix }}.digest"

      - name: Upload digest
        if: steps.meta.outputs.channel == 'stable' || steps.meta.outputs.channel == 'beta'
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch_suffix }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish-manifest:
    name: Create Multi-Arch Manifest List
    needs: build-arch
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read VERSION
        id: version
        run: |
          VERSION_VAL=$(cat VERSION | tr -d '\n' | xargs)
          echo "tag=v${VERSION_VAL}"    >> $GITHUB_OUTPUT
          echo "version=${VERSION_VAL}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PAT }}

      - name: Resolve release channel
        id: channel
        run: |
          git fetch origin main
          if git merge-base --is-ancestor HEAD origin/main; then
            ON_MAIN=true
          else
            ON_MAIN=false
          fi
          python3 scripts/resolve_release_channel.py \
            --ref "${{ github.ref_name }}" \
            --version "${{ steps.version.outputs.version }}" \
            --on-main "${ON_MAIN}" \
            --github-output "$GITHUB_OUTPUT"

      - name: Download architecture digests
        if: steps.channel.outputs.channel != 'skip'
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Merge and Push Multi-Arch Manifests
        if: steps.channel.outputs.channel == 'stable' || steps.channel.outputs.channel == 'beta'
        run: |
          set -eu
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="zyrabitcore/${{ env.IMAGE_NAME }}"
          GHCR="ghcr.io/${OWNER}/${{ env.IMAGE_NAME }}"
          IMMUTABLE="${{ steps.channel.outputs.immutable_tags }}"
          MUTABLE="${{ steps.channel.outputs.mutable_tags }}"

          python3 scripts/resolve_release_channel.py \
            --ref "${{ github.ref_name }}" \
            --version "${{ steps.version.outputs.version }}" \
            --on-main "${{ steps.channel.outputs.channel == 'stable' && 'true' || 'false' }}" \
            --sha "${{ github.sha }}" \
            --digest-dir /tmp/digests \
            --ledger "${{ runner.temp }}/release-ledger.json" \
            --github-output /dev/null

          refuse_existing() {
            local image="$1" tag="$2"
            if docker buildx imagetools inspect "${image}:${tag}" >/dev/null 2>&1; then
              echo "Refusing to move published tag ${image}:${tag}."
              exit 1
            fi
          }
          for tag in ${IMMUTABLE}; do
            refuse_existing "${IMAGE}" "${tag}"
            refuse_existing "${GHCR}" "${tag}"
          done

          publish_one() {
            local image="$1" tag="$2"
            shift 2
            echo "Publishing ${image}:${tag}"
            docker buildx imagetools create -t "${image}:${tag}" "$@"
          }

          hub_sources=()
          ghcr_sources=()
          for arch in amd64 arm64; do
            digest="$(tr -d '[:space:]' < "/tmp/digests/${arch}.digest")"
            hub_sources+=("${IMAGE}@${digest}")
            ghcr_sources+=("${GHCR}@${digest}")
          done

          for tag in ${IMMUTABLE}; do
            publish_one "${IMAGE}" "${tag}" "${hub_sources[@]}"
            publish_one "${GHCR}" "${tag}" "${ghcr_sources[@]}"
          done

          curl -fsSL "https://hub.docker.com/v2/repositories/${IMAGE}/" > /tmp/hub-repo.json
          for tag in ${MUTABLE}; do
            publish_one "${GHCR}" "${tag}" "${ghcr_sources[@]}"
            if python3 -c 'import json,sys,importlib.util; spec=importlib.util.spec_from_file_location("channel","scripts/resolve_release_channel.py"); mod=importlib.util.module_from_spec(spec); spec.loader.exec_module(mod); settings=json.load(open("/tmp/hub-repo.json")).get("immutable_tags_settings") or {}; sys.exit(0 if mod.docker_hub_tag_is_immutable(sys.argv[1], settings) else 1)' "${tag}"; then
              echo "Docker Hub freezes ${IMAGE}:${tag}. The moving tag is published on ${GHCR}:${tag}."
              continue
            fi
            publish_one "${IMAGE}" "${tag}" "${hub_sources[@]}"
          done

      - name: Create GitHub Release
        if: steps.channel.outputs.channel == 'stable' || steps.channel.outputs.channel == 'beta'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          prerelease: ${{ steps.channel.outputs.prerelease == 'true' }}
          body_path: ${{ runner.temp }}/release-ledger.json
          generate_release_notes: false
