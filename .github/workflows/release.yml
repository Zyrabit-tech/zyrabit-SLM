name: Release and Deploy

on:
  push:
    tags:
      - 'v*'       # e.g. v2.4.3
  workflow_dispatch:
    inputs:
      force_push:
        description: 'Force Docker push regardless of branch'
        required: false
        default: 'false'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  IMAGE_NAME: zyrabit-slm

jobs:
  build-arch:
    name: Build Arch Image
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch_suffix: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch_suffix: arm64
    permissions:
      contents: read
      packages: write
      actions: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Read VERSION
        id: version
        run: |
          VERSION_VAL=$(cat VERSION | tr -d '\n' | xargs)
          echo "tag=v${VERSION_VAL}"    >> $GITHUB_OUTPUT
          echo "version=${VERSION_VAL}" >> $GITHUB_OUTPUT

      - name: Resolve branch type
        id: meta
        run: |
          BRANCH="${{ github.ref_name }}"
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="zyrabitcore/${{ env.IMAGE_NAME }}"
          GHCR="ghcr.io/${OWNER}/${{ env.IMAGE_NAME }}"

          echo "branch=${BRANCH}" >> $GITHUB_OUTPUT
          echo "owner=${OWNER}"   >> $GITHUB_OUTPUT
          echo "image=${IMAGE}"     >> $GITHUB_OUTPUT
          echo "ghcr=${GHCR}"       >> $GITHUB_OUTPUT

          if [ "${BRANCH}" = "main" ] || [[ "${BRANCH}" =~ ^v[0-9] ]]; then
            echo "channel=stable" >> $GITHUB_OUTPUT
          elif [ "${BRANCH}" = "beta" ]; then
            echo "channel=beta" >> $GITHUB_OUTPUT
          else
            echo "⚠️  Unknown branch pattern '${BRANCH}' — skipping Docker push."
            echo "channel=skip" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        if: steps.meta.outputs.channel != 'skip'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.meta.outputs.channel != 'skip'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: steps.meta.outputs.channel != 'skip'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PAT }}

      - name: Run Trivy vulnerability scan
        if: steps.meta.outputs.channel != 'skip'
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: './zyrabit-slm/api-rag'
          severity: 'CRITICAL'
          exit-code: '1'

      - name: Build and push image by digest
        id: build
        if: steps.meta.outputs.channel != 'skip'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./zyrabit-slm/api-rag/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,"name=${{ steps.meta.outputs.image }},${{ steps.meta.outputs.ghcr }}",push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export digest
        if: steps.meta.outputs.channel != 'skip'
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        if: steps.meta.outputs.channel != 'skip'
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch_suffix }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish-manifest:
    name: Create Multi-Arch Manifest List
    needs: build-arch
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Read VERSION
        id: version
        run: |
          VERSION_VAL=$(cat VERSION | tr -d '\n' | xargs)
          echo "tag=v${VERSION_VAL}"    >> $GITHUB_OUTPUT
          echo "version=${VERSION_VAL}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PAT }}

      - name: Resolve release channel
        id: channel
        run: |
          BRANCH="${{ github.ref_name }}"
          if [ "${BRANCH}" = "main" ] || [[ "${BRANCH}" =~ ^v[0-9] ]]; then
            echo "channel=stable" >> "$GITHUB_OUTPUT"
          elif [ "${BRANCH}" = "beta" ]; then
            echo "channel=beta" >> "$GITHUB_OUTPUT"
          else
            echo "channel=skip" >> "$GITHUB_OUTPUT"
          fi

      - name: Download architecture digests
        if: steps.channel.outputs.channel != 'skip'
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Merge and Push Multi-Arch Manifests
        if: steps.channel.outputs.channel != 'skip'
        run: |
          set -eu
          VERSION="${{ steps.version.outputs.version }}"
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="zyrabitcore/${{ env.IMAGE_NAME }}"
          GHCR="ghcr.io/${OWNER}/${{ env.IMAGE_NAME }}"
          CHANNEL="${{ steps.channel.outputs.channel }}"

          shopt -s nullglob
          files=(/tmp/digests/*)
          if [ "${#files[@]}" -ne 2 ]; then
            echo "Expected 2 architecture digests, found ${#files[@]}."
            exit 1
          fi

          hub_sources=()
          ghcr_sources=()
          for f in "${files[@]}"; do
            hex="$(basename "$f")"
            hub_sources+=("${IMAGE}@sha256:${hex}")
            ghcr_sources+=("${GHCR}@sha256:${hex}")
          done

          if [ "${CHANNEL}" = "stable" ]; then
            echo "Publishing ${IMAGE}:${VERSION} and ${IMAGE}:latest"
            docker buildx imagetools create \
              -t "${IMAGE}:${VERSION}" \
              -t "${IMAGE}:latest" \
              "${hub_sources[@]}"
            docker buildx imagetools create \
              -t "${GHCR}:${VERSION}" \
              -t "${GHCR}:latest" \
              "${ghcr_sources[@]}"
          else
            echo "Publishing ${IMAGE}:beta and ${IMAGE}:beta-${VERSION}"
            docker buildx imagetools create \
              -t "${IMAGE}:beta" \
              -t "${IMAGE}:beta-${VERSION}" \
              "${hub_sources[@]}"
            docker buildx imagetools create \
              -t "${GHCR}:beta" \
              -t "${GHCR}:beta-${VERSION}" \
              "${ghcr_sources[@]}"
          fi

      - name: Create GitHub Release
        if: github.ref_name == 'main' || startsWith(github.ref_name, 'v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.tag }}
          generate_release_notes: true
