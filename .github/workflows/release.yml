name: Release and Deploy

on:
  push:
    tags:
      - 'v*'       # e.g. v2.4.3
  workflow_dispatch:
    inputs:
      force_push:
        description: 'Force Docker push regardless of branch'
        required: false
        default: 'false'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  IMAGE_NAME: zyrabit-slm

jobs:
  build-arch:
    name: Build Arch Image
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch_suffix: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch_suffix: arm64
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Read VERSION
        id: version
        run: |
          VERSION_VAL=$(cat VERSION | tr -d '\n' | xargs)
          echo "tag=v${VERSION_VAL}"    >> $GITHUB_OUTPUT
          echo "version=${VERSION_VAL}" >> $GITHUB_OUTPUT

      - name: Resolve branch type and Arch Tags
        id: meta
        run: |
          BRANCH="${{ github.ref_name }}"
          VERSION="${{ steps.version.outputs.version }}"
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="zyrabitcore/${{ env.IMAGE_NAME }}"
          GHCR="ghcr.io/${OWNER}/${{ env.IMAGE_NAME }}"
          SUFFIX="${{ matrix.arch_suffix }}"

          echo "branch=${BRANCH}"      >> $GITHUB_OUTPUT
          echo "version=${VERSION}"    >> $GITHUB_OUTPUT
          echo "owner=${OWNER}"        >> $GITHUB_OUTPUT
          echo "image=${IMAGE}"        >> $GITHUB_OUTPUT
          echo "ghcr=${GHCR}"          >> $GITHUB_OUTPUT

          TAGS=""
          if [ "${BRANCH}" = "main" ] || [[ "${BRANCH}" =~ ^v[0-9] ]]; then
            # Enterprise Tagging Policy: Only canonical arch slices are pushed to assemble manifests
            TAGS="${IMAGE}:${VERSION}-${SUFFIX},${GHCR}:${VERSION}-${SUFFIX}"
            echo "channel=stable" >> $GITHUB_OUTPUT
          elif [ "${BRANCH}" = "beta" ]; then
            # Beta channel arch slices
            TAGS="${IMAGE}:beta-${VERSION}-${SUFFIX},${GHCR}:beta-${VERSION}-${SUFFIX}"
            echo "channel=beta" >> $GITHUB_OUTPUT
          else
            echo "⚠️  Unknown branch pattern '${BRANCH}' — skipping Docker push."
            echo "channel=skip" >> $GITHUB_OUTPUT
          fi
          echo "tags=${TAGS}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        if: steps.meta.outputs.channel != 'skip'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.meta.outputs.channel != 'skip'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: steps.meta.outputs.channel != 'skip'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PAT }}

      - name: Run Trivy vulnerability scan
        if: steps.meta.outputs.channel != 'skip'
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: './zyrabit-slm/api-rag'
          severity: 'CRITICAL'
          exit-code: '1'

      - name: Build and push Arch Docker image
        if: steps.meta.outputs.channel != 'skip'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./zyrabit-slm/api-rag/Dockerfile
          push: true
          platforms: ${{ matrix.platform }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-manifest:
    name: Create Multi-Arch Manifest List
    needs: build-arch
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Read VERSION
        id: version
        run: |
          VERSION_VAL=$(cat VERSION | tr -d '\n' | xargs)
          echo "tag=v${VERSION_VAL}"    >> $GITHUB_OUTPUT
          echo "version=${VERSION_VAL}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PAT }}

      - name: Merge and Push Multi-Arch Manifests
        run: |
          BRANCH="${{ github.ref_name }}"
          VERSION="${{ steps.version.outputs.version }}"
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="zyrabitcore/${{ env.IMAGE_NAME }}"
          GHCR="ghcr.io/${OWNER}/${{ env.IMAGE_NAME }}"

          if [ "${BRANCH}" = "main" ] || [[ "${BRANCH}" =~ ^v[0-9] ]]; then
            echo "Creating Unified Multi-Arch Manifest for Docker Hub (${IMAGE}:${VERSION}, v${VERSION}, latest)..."
            docker buildx imagetools create \
              -t ${IMAGE}:${VERSION} \
              -t ${IMAGE}:v${VERSION} \
              -t ${IMAGE}:latest \
              ${IMAGE}:${VERSION}-amd64 ${IMAGE}:${VERSION}-arm64
            
            echo "Creating Unified Multi-Arch Manifest for GHCR (${GHCR}:${VERSION}, v${VERSION}, latest)..."
            docker buildx imagetools create \
              -t ${GHCR}:${VERSION} \
              -t ${GHCR}:v${VERSION} \
              -t ${GHCR}:latest \
              ${GHCR}:${VERSION}-amd64 ${GHCR}:${VERSION}-arm64

          elif [ "${BRANCH}" = "beta" ]; then
            echo "Creating Beta Multi-Arch Manifest for Docker Hub (${IMAGE}:beta, beta-${VERSION})..."
            docker buildx imagetools create \
              -t ${IMAGE}:beta \
              -t ${IMAGE}:beta-${VERSION} \
              ${IMAGE}:beta-${VERSION}-amd64 ${IMAGE}:beta-${VERSION}-arm64

            echo "Creating Beta Multi-Arch Manifest for GHCR (${GHCR}:beta, beta-${VERSION})..."
            docker buildx imagetools create \
              -t ${GHCR}:beta \
              -t ${GHCR}:beta-${VERSION} \
              ${GHCR}:beta-${VERSION}-amd64 ${GHCR}:beta-${VERSION}-arm64
          fi

      - name: Create GitHub Release
        if: github.ref_name == 'main' || startsWith(github.ref_name, 'v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.tag }}
          generate_release_notes: true
