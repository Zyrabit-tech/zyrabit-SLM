# pnpm v9+ configuration — overrides and build controls live here, not in package.json

# Silences ERR_PNPM_IGNORED_BUILDS: core-js postinstall is a cosmetic fundraising script, not needed.
ignoredBuiltDependencies:
  - core-js

# Security overrides — pin vulnerable transitive deps to safe versions
overrides:
  serialize-javascript: "^7.0.5"
  svgo: ">=3.3.4"
  http-proxy-middleware: ">=2.0.10"
  joi: ">=17.13.4"
  js-yaml: ">=3.15.0"
  webpack-dev-server: ">=5.2.6"
  dompurify: ">=3.4.11"
