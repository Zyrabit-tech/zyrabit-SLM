name: zyrabit-slm

services:
  traefik:
    image: traefik:v3.0
    container_name: zyrabit-traefik
    profiles: [ "production" ]
    environment:
      - DOCKER_API_VERSION=1.40
    command:
      - --api.dashboard=true
      - --providers.docker=true
      - --providers.docker.apiVersion=1.40
      - --providers.docker.exposedbydefault=false
      - --providers.file.directory=/etc/traefik/dynamic
      - --metrics.prometheus=true
      - --metrics.prometheus.buckets=0.1,0.3,1.2,5.0
      - --entryPoints.web.address=:80
      - --entryPoints.web.http.redirections.entryPoint.to=websecure
      - --entryPoints.web.http.redirections.entryPoint.scheme=https
      - --entryPoints.websecure.address=:443
      - --entryPoints.websecure.http.tls=true
      - --api.insecure=true
      - --log.level=${TRAEFIK_LOG_LEVEL:-INFO}
    ports:
      - "80:80"
      - "443:443"
      - "8081:8080" # Dashboard access
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./traefik:/etc/traefik/dynamic:ro
    networks:
      - zyrabit-sovereign-net

  # 1. THE BRAIN: API RAG
  zyrabit-api:
    image: zyrabit-slm/api-rag
    build:
      context: ..
      dockerfile: zyrabit-slm/api-rag/Dockerfile
    container_name: zyrabit-api
    ports:
      - "8088:8080"
    expose:
      - "8080"
    env_file:
      - .env
    environment:
      - N8N_SERVICE_TOKEN_FILE=/run/secrets/n8n_service_token
      - N8N_WEBHOOK_SIGNING_SECRET_FILE=/run/secrets/n8n_webhook_signing_secret
      - ONNXRUNTIME_LOGGING_LEVEL=3
      - DOCS_DIR=/app/document_source
    depends_on:

      zyrabit-db:
        condition: service_started
      zyrabit-engine:
        condition: service_started
    labels:
      - traefik.enable=true
      - traefik.http.routers.zyrabit-api.rule=Host(`${DOMAIN:-localhost}`) && (PathPrefix(`/v1`) || PathPrefix(`/socket.io`) || PathPrefix(`/ag-ui`))
      - traefik.http.routers.zyrabit-api.entrypoints=websecure
      - traefik.http.routers.zyrabit-api.tls=true
      - traefik.http.routers.zyrabit-api.middlewares=api-ratelimit@docker,secureHeaders@file
      - traefik.http.services.zyrabit-api.loadbalancer.server.port=8080
      - traefik.http.middlewares.api-ratelimit.ratelimit.average=25
      - traefik.http.middlewares.api-ratelimit.ratelimit.burst=50
      - traefik.docker.network=zyrabit-slm_zyrabit-sovereign-net
    networks:
      - zyrabit-sovereign-net
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./secrets:/run/secrets:ro
      - ./prompts:/app/prompts:ro
      - ./document_source:/app/document_source
      - ./db_data:/app/db_data
      - ./api-rag/app:/app/app

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/v1/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # 1.5 THE FACE: Web UI
  zyrabit-web:
    image: zyrabit-slm/web-ui
    build:
      context: ..
      dockerfile: zyrabit-slm/web-ui/Dockerfile
    container_name: zyrabit-web
    environment:
      ZYRABIT_API_KEY_WEB: ${ZYRABIT_API_KEY_WEB}
    ports:
      - "${ZYRABIT_LOCAL_PORT:-8080}:80"
    labels:
      - traefik.enable=true
      - traefik.http.routers.zyrabit-web.rule=Host(`${DOMAIN:-localhost}`) && PathPrefix(`/`)
      - traefik.http.routers.zyrabit-web.entrypoints=websecure
      - traefik.http.routers.zyrabit-web.tls=true
      - traefik.http.routers.zyrabit-web.middlewares=secureHeaders@file
      - traefik.http.services.zyrabit-web.loadbalancer.server.port=80
      - traefik.docker.network=zyrabit-slm_zyrabit-sovereign-net
    networks:
      - zyrabit-sovereign-net
    depends_on:
      - zyrabit-api

  # 2. THE MUSCLE: SLM Server
  zyrabit-engine:
    image: ollama/ollama:0.3.1
    container_name: zyrabit-engine
    environment:
      - OLLAMA_NUM_PARALLEL=${OLLAMA_NUM_PARALLEL:-1}
    volumes:
      - ~/.ollama:/root/.ollama
    dns:
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - zyrabit-sovereign-net
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  # 2.5 THE SILICON ENGINE: Hardware Serving Layer (Blackhole p150 / GPU / Metal)
  zyrabit-vllm-tt:
    image: ghcr.io/tenstorrent/tt-inference-server/vllm-tt-metal-src-release-ubuntu-22.04-amd64:0.8.0-55fd115-aa4ae1e
    container_name: zyrabit-vllm-tt
    profiles: [ "hardware", "tenstorrent" ]
    env_file:
      - .env
    command:
      - /bin/bash
      - -c
      - |
        set -e
        if [ -n "$${PYTHON_ENV_DIR}" ] && [ -f "$${PYTHON_ENV_DIR}/bin/activate" ]; then
          source "$${PYTHON_ENV_DIR}/bin/activate"
        fi
        export TT_MODEL_SPEC_JSON_PATH="$${TT_MODEL_SPEC_JSON_PATH:-/model_spec.json}"
        export CACHE_ROOT=/home/container_app_user/cache_root
        export TT_CACHE_PATH="$${CACHE_ROOT}/tt_cache"
        TARGET_MODEL="$${TT_HF_MODEL_NAME:-$${MODEL_NAME:-Qwen2.5-3B-Instruct}}"
        MODEL_SNAP=$$(find /hf-cache/hub -maxdepth 4 -type d -path "*/snapshots/*" 2>/dev/null | grep -i "$$TARGET_MODEL" | head -1 | sed 's:/$$::')
        if [ -z "$$MODEL_SNAP" ]; then
          MODEL_SNAP=$$(find /hf-cache/hub -maxdepth 4 -type d -path "*/snapshots/*" 2>/dev/null | head -1 | sed 's:/$$::')
        fi
        if [ -z "$$MODEL_SNAP" ]; then
          echo "ERROR: Model '$$TARGET_MODEL' not found in /hf-cache" >&2
          ls -la /hf-cache /hf-cache/hub 2>/dev/null || true
          exit 1
        fi
        export MODEL_WEIGHTS_PATH="$$MODEL_SNAP"
        echo "Serving $$MODEL_WEIGHTS_PATH on Tenstorrent..."
        exec python /home/container_app_user/app/src/run_vllm_api_server.py
    devices:
      - /dev/tenstorrent:/dev/tenstorrent
    ipc: host
    environment:
      - CACHE_ROOT=/home/container_app_user/cache_root
      - HF_HOME=/hf-cache
      - HF_HUB_OFFLINE=1
      - MESH_DEVICE=${MESH_DEVICE:-P150}
      - TT_METAL_ARCH_NAME=blackhole
      - VLLM_RPC_TIMEOUT=100000
      - TT_HF_MODEL_NAME=${TT_HF_MODEL_NAME:-Qwen2.5-3B-Instruct}
      - TT_MODEL_SPEC_JSON_PATH=${TT_MODEL_SPEC_JSON_PATH:-/model_spec.json}
    volumes:
      - tt-cache-root:/home/container_app_user/cache_root
      - ${ZYRABIT_HF_CACHE_DIR:-./hf-cache}:/hf-cache
      - /dev/hugepages-1G:/dev/hugepages-1G
      - ./api-rag/app/infrastructure/engine/tenstorrent/${TT_MODEL_SPEC:-model_spec_qwen25_3b_p150.json}:/model_spec.json:ro
    ports:
      - "8090:8000"
    networks:
      - zyrabit-sovereign-net

  # 3. THE MEMORY: Vector DB
  zyrabit-db:
    image: chromadb/chroma:1.5.9
    container_name: zyrabit-db
    environment:
      - ANONYMIZED_TELEMETRY=False
      - CHROMA_OTEL_COLLECTION_ENDPOINT=http://localhost:4317
      - CHROMA_OTEL_SERVICE_NAME=zyrabit-vector-db
      - ORT_LOGGING_LEVEL=3
    ports:
      - "8000:8000"
    volumes:
      - ./chroma-data:/data
    networks:
      - zyrabit-sovereign-net
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/8000' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 4. THE MONITOR (Scraper): Prometheus
  zyrabit-prometheus:
    image: prom/prometheus:v2.53.0
    container_name: zyrabit-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    labels:
      - traefik.enable=true
      - traefik.http.routers.zyrabit-prometheus.rule=PathPrefix(`/prometheus`)
      - traefik.http.routers.zyrabit-prometheus.entrypoints=websecure
      - traefik.http.routers.zyrabit-prometheus.tls=true
      - traefik.http.routers.zyrabit-prometheus.middlewares=prometheus-auth@docker,secureHeaders@file
      - traefik.http.middlewares.prometheus-auth.basicauth.users=${PROMETHEUS_BASIC_AUTH:-admin:$$2y$$05$$placeholder}
      - traefik.http.services.zyrabit-prometheus.loadbalancer.server.port=9090
      - traefik.docker.network=zyrabit-slm_zyrabit-sovereign-net
    networks:
      - zyrabit-sovereign-net

  # 5. THE MONITOR (Dashboard): Grafana
  # External Host Port: 3000 -> Internal Container Port: 3000
  zyrabit-grafana:
    image: grafana/grafana:11.1.0
    container_name: zyrabit-grafana
    environment:
      - GF_SERVER_ROOT_URL=${GRAFANA_ROOT_URL:-%(protocol)s://%(domain)s:%(http_port)s/}
      - GF_SERVER_SERVE_FROM_SUB_PATH=${GRAFANA_SERVE_FROM_SUB_PATH:-false}
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=false
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/datasources:/etc/grafana/provisioning/datasources
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards
    labels:
      - traefik.enable=true
      - traefik.http.routers.zyrabit-grafana.rule=PathPrefix(`/grafana`)
      - traefik.http.routers.zyrabit-grafana.entrypoints=websecure
      - traefik.http.routers.zyrabit-grafana.tls=true
      - traefik.http.routers.zyrabit-grafana.middlewares=grafana-auth@docker,secureHeaders@file
      - traefik.http.middlewares.grafana-auth.basicauth.users=${GRAFANA_BASIC_AUTH:-admin:$$2y$$05$$placeholder}
      - traefik.http.services.zyrabit-grafana.loadbalancer.server.port=3000
      - traefik.docker.network=zyrabit-slm_zyrabit-sovereign-net
    depends_on:
      - zyrabit-prometheus
    networks:
      - zyrabit-sovereign-net

  zyrabit-loki:
    image: grafana/loki:3.1.0
    container_name: zyrabit-loki
    command: -config.file=/etc/loki/local-config.yaml
    profiles: [ "observability-extra" ]
    ports:
      - "3100:3100"
    networks:
      - zyrabit-sovereign-net


  zyrabit-n8n:
    image: n8nio/n8n:1.50.0
    container_name: zyrabit-n8n
    profiles: [ "automation" ]
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - N8N_PATH=/n8n
      - WEBHOOK_URL=https://localhost/n8n/
      - N8N_SECURE_COOKIE=false
    labels:
      - traefik.enable=true
      - traefik.http.routers.zyrabit-n8n.rule=PathPrefix(`/n8n`)
      - traefik.http.routers.zyrabit-n8n.entrypoints=websecure
      - traefik.http.routers.zyrabit-n8n.tls=true
      - traefik.http.routers.zyrabit-n8n.middlewares=secureHeaders@file
      - traefik.http.services.zyrabit-n8n.loadbalancer.server.port=5678
      - traefik.docker.network=zyrabit-slm_zyrabit-sovereign-net
    volumes:
      - ./n8n-data:/home/node/.n8n
    networks:
      - zyrabit-sovereign-net

  # 6. SYSTEM ASSISTANT: MCP Installer Server
  zyrabit-mcp:
    image: zyrabit-slm/mcp
    build:
      context: ../mcp
    container_name: zyrabit-mcp
    env_file:
      - .env
    volumes:
      - ../README.md:/app/README.md:ro
      - ../CONTRIBUTING.md:/app/CONTRIBUTING.md:ro
    ports:
      - "8001:8001"
    networks:
      - zyrabit-sovereign-net

  # 7. THE LEDGER: PostgreSQL (Production mode only - profile: db)
  zyrabit-postgres:
    image: postgres:16-alpine
    container_name: zyrabit-postgres
    profiles: [ "db" ]
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-zyrabit_db}
      - POSTGRES_USER=${POSTGRES_USER:-zyrabit}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-zyrabit_secret}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - zyrabit-sovereign-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zyrabit} -d ${POSTGRES_DB:-zyrabit_db}"]
      interval: 30s
      timeout: 10s
      retries: 5

  # 8. BARE INFERENCE: Standalone Engine without Web UI / RAG (profile: bare)
  zyrabit-bare-engine:
    image: ollama/ollama:0.3.1
    container_name: zyrabit-bare-engine
    profiles: [ "bare" ]
    environment:
      - OLLAMA_NUM_PARALLEL=${OLLAMA_NUM_PARALLEL:-1}
    volumes:
      - ~/.ollama:/root/.ollama
    ports:
      - "8088:11434"
    networks:
      - zyrabit-sovereign-net
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

networks:
  zyrabit-sovereign-net:
    driver: bridge

volumes:
  prometheus-data:
  grafana-data:
  postgres-data:
  tt-cache-root:
