name: zyrabit-slm-airgapped

# Air-Gapped Sovereign Deployment Profile
# No public DNS servers configured, no external network access allowed.

services:
  traefik:
    image: traefik:v3.0
    container_name: zyrabit-traefik
    command:
      - --api.dashboard=false
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.file.directory=/etc/traefik/dynamic
      - --metrics.prometheus=true
      - --entryPoints.web.address=:80
      - --entryPoints.web.http.redirections.entryPoint.to=websecure
      - --entryPoints.web.http.redirections.entryPoint.scheme=https
      - --entryPoints.websecure.address=:443
      - --entryPoints.websecure.http.tls=true
      - --log.level=${TRAEFIK_LOG_LEVEL:-INFO}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./traefik:/etc/traefik/dynamic:ro
    networks:
      - zyrabit-sovereign-net

  zyrabit-api:
    image: zyrabit-slm/api-rag:latest
    container_name: zyrabit-api
    env_file:
      - .env
    environment:
      - N8N_SERVICE_TOKEN_FILE=/run/secrets/n8n_service_token
      - N8N_WEBHOOK_SIGNING_SECRET_FILE=/run/secrets/n8n_webhook_signing_secret
      - ONNXRUNTIME_LOGGING_LEVEL=3
      - DOCS_DIR=/app/document_source
      - AIRGAPPED_MODE=true
    depends_on:
      zyrabit-db:
        condition: service_started
      zyrabit-engine:
        condition: service_started
    labels:
      - traefik.enable=true
      - traefik.http.routers.zyrabit-api.rule=Host(`${DOMAIN}`) && (PathPrefix(`/v1`) || PathPrefix(`/socket.io`) || PathPrefix(`/ag-ui`))
      - traefik.http.routers.zyrabit-api.entrypoints=websecure
      - traefik.http.routers.zyrabit-api.tls=true
      - traefik.http.routers.zyrabit-api.middlewares=api-ratelimit@docker,secureHeaders@file
      - traefik.http.services.zyrabit-api.loadbalancer.server.port=8080
      - traefik.http.middlewares.api-ratelimit.ratelimit.average=25
      - traefik.http.middlewares.api-ratelimit.ratelimit.burst=50
      - traefik.docker.network=zyrabit-slm_zyrabit-sovereign-net
    networks:
      - zyrabit-sovereign-net
      - model-network
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./secrets:/run/secrets:ro
      - ./prompts:/app/prompts:ro
      - ./document_source:/app/document_source
      - ./db_data:/app/db_data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/v1/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  zyrabit-web:
    image: zyrabit-slm/web-ui:latest
    container_name: zyrabit-web
    labels:
      - traefik.enable=true
      - traefik.http.routers.zyrabit-web.rule=Host(`${DOMAIN}`) && PathPrefix(`/`)
      - traefik.http.routers.zyrabit-web.entrypoints=websecure
      - traefik.http.routers.zyrabit-web.tls=true
      - traefik.http.routers.zyrabit-web.middlewares=secureHeaders@file
      - traefik.http.services.zyrabit-web.loadbalancer.server.port=80
      - traefik.docker.network=zyrabit-slm_zyrabit-sovereign-net
    networks:
      - zyrabit-sovereign-net
    depends_on:
      - zyrabit-api

  zyrabit-engine:
    image: ollama/ollama:0.3.1
    container_name: zyrabit-engine
    environment:
      - OLLAMA_NUM_PARALLEL=${OLLAMA_NUM_PARALLEL:-1}
    volumes:
      - ~/.ollama:/root/.ollama
    networks:
      - model-network
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  zyrabit-db:
    image: chromadb/chroma:0.5.3
    container_name: zyrabit-db
    environment:
      - ANONYMIZED_TELEMETRY=False
      - ORT_LOGGING_LEVEL=3
    volumes:
      - ./chroma-data:/data
    networks:
      - zyrabit-sovereign-net
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/8000' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  zyrabit-sovereign-net:
    driver: bridge
    internal: true
  model-network:
    driver: bridge
    internal: true
