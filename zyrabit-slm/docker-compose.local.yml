name: zyrabit-slm

# Local profile: one browser entrypoint, no TLS proxy, no monitoring stack.
# Optional operational services live in docker-compose.monitoring.yml.
services:
  zyrabit-api:
    build:
      context: ..
      dockerfile: zyrabit-slm/api-rag/Dockerfile
    image: zyrabit-slm/api-rag
    container_name: zyrabit-api
    env_file: [.env]
    environment:
      SLM_URL: ${SLM_URL:-http://host.docker.internal:11434}
      DB_HOST: zyrabit-db
      DB_PORT: 8000
      DOCS_DIR: /app/document_source
    volumes:
      - ./document_source:/app/document_source
      - ./db_data:/app/db_data
      - ./prompts:/app/prompts:ro
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      zyrabit-db:
        condition: service_healthy
    networks: [runtime]

  zyrabit-web:
    build:
      context: ..
      dockerfile: zyrabit-slm/web-ui/Dockerfile
    image: zyrabit-slm/web-ui
    container_name: zyrabit-web
    environment:
      ZYRABIT_API_KEY_WEB: ${ZYRABIT_API_KEY_WEB}
    ports:
      - "${ZYRABIT_LOCAL_PORT:-8080}:80"
    depends_on: [zyrabit-api]
    networks: [runtime]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3

  zyrabit-db:
    image: chromadb/chroma:0.5.3
    container_name: zyrabit-db
    environment:
      ANONYMIZED_TELEMETRY: "False"
    volumes:
      - ./chroma-data:/data
    networks: [runtime]
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/8000' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

networks:
  runtime:
    driver: bridge
