name: zyrabit-slm

services:
  # 1. THE BRAIN: API RAG
  zyrabit-api:
    image: zyrabit-slm/api-rag
    build:
      context: ..
      dockerfile: zyrabit-slm/api-rag/Dockerfile
    container_name: zyrabit-api
    env_file:
      - .env
    environment:
      - N8N_SERVICE_TOKEN_FILE=/run/secrets/n8n_service_token
      - N8N_WEBHOOK_SIGNING_SECRET_FILE=/run/secrets/n8n_webhook_signing_secret
      - SLM_URL=${SLM_URL:-http://host.docker.internal:11434}
      - DB_URL=http://zyrabit-db:8000
    ports:
      - "8082:8080" # Moved from 8080 to avoid Mac system conflicts
    networks:
      - backend-network
      - model-network
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./secrets:/run/secrets:ro
      - ./prompts:/app/prompts:ro
      - ./document_source:/app/document_source
      - ../README.md:/app/README.md:ro # For auto-ingest
      - ./db_data:/app/db_data
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # 1.5 THE FACE: Web UI
  zyrabit-web:
    image: zyrabit-slm/web-ui
    build:
      context: ..
      dockerfile: zyrabit-slm/web-ui/Dockerfile
    container_name: zyrabit-web
    ports:
      - "3000:80"
    networks:
      - backend-network
    volumes:
      - ./web-ui/public/img:/usr/share/nginx/html/img:ro
    depends_on:
      - zyrabit-api
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost" ]
      interval: 30s
      timeout: 10s
      retries: 3

  # 2. THE MUSCLE: SLM Server (DISABLED - Using Native Metal)
  # zyrabit-engine:
  #   image: ollama/ollama:latest
  #   container_name: zyrabit-engine
  #   environment:
  #     - OLLAMA_NUM_PARALLEL=${OLLAMA_NUM_PARALLEL:-1}
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ./ollama-models:/root/.ollama
  #   networks:
  #     - model-network

  # 3. THE MEMORY: Vector DB
  zyrabit-db:
    image: chromadb/chroma:0.5.20
    container_name: zyrabit-db
    environment:
      - ANONYMIZED_TELEMETRY=False
    ports:
      - "8000:8000"
    volumes:
      - ./chroma-data:/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/8000' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - backend-network

networks:
  backend-network:
    driver: bridge
  model-network:
    driver: bridge
    internal: true

